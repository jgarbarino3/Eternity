schema_version: "0.1"
experiment_id: linear_standrews_tin_50nm_threshold_locked_clean_run_001
question: "Does the locked Phase 3C.3 St Andrews 50 nm TiN reflectance policy pass a clean zero-fit TMM run?"
hypothesis: "A frozen St Andrews 50 nm / 50 C TiN epsilon table may predict the paper-backed normal-incidence reflectance within predeclared thresholds, but even a pass only permits Phase 4 review."

sample:
  sample_id: public_standrews_tin_50nm_50c
  material: TiN
  thickness:
    value: 50
    unit: nm
  stack_ref: public_standrews_tin_50nm_50c_air_tin_glass
  material_model:
    type: registry_multilayer_stack
    parameters_ref: public_standrews_tin_50nm_50c_air_tin_glass
    registry_path: lab_data/registry.yaml
    material_model_ref: null
  layers:
    - material: TiN
      thickness:
        value: 50
        unit: nm
      material_model_ref: public_standrews_tin_50nm_50c_epsilon_model

input_pulse:
  kind: synthetic_gaussian
  center_wavelength:
    value: 540
    unit: nm
  bandwidth:
    value: 300
    unit: nm

geometry:
  incidence_angle:
    value: 0
    unit: deg
  polarization: TE
  incident_medium: air
  substrate: glass

simulator:
  name: linear_transfer_matrix
  version: "0.1"
  wavelength_range:
    min: 400
    max: 1000
    points: 601
    unit: nm

observables:
  - reflection_spectrum
  - transmission_spectrum
  - absorption

acceptance_tests:
  - registry_artifact_hashes
  - st_andrews_pairing_gate
  - multilayer_tmm_energy_accounting
  - no_fit_leakage_gate
  - phase3c3_threshold_policy_predeclared
  - phase3c3_reflectance_normalization_gate
  - no_direct_calibrated_evidence_before_phase4_review

validity_envelope:
  wavelength:
    min: 400
    max: 1000
    unit: nm
  fluence:
    min: 0
    max: 0.01
    unit: mJ/cm^2
  trusted_notes:
    - "Linear passive TMM only, using the frozen St Andrews 50 nm / 50 C TiN epsilon table."
    - "The linked paper maps Figure 4 to normal-incidence unpolarized R/T for 50 nm TiN on glass over 400-1000 nm."
    - "At normal incidence, TE and TM predictions are equivalent for this isotropic stack; TE is used as the implementation channel."
    - "The Phase 3C.3 threshold policy was recorded before this clean run."
  untrusted_notes:
    - "RT.xlsx does not independently label the annealing condition."
    - "Transmittance remains auxiliary and cannot decide threshold pass/fail."
    - "Passing Phase 3C.3 would only permit Phase 4 review, not direct calibrated_linear_evidence."
    - "No nonlinear ENZ, FROG, roughness, detector response, or pump-probe behavior is modeled."

validation:
  registry_path: lab_data/registry.yaml
  split_ref: public_standrews_tin_50nm_50c_validation_candidate
  holdout_measurement_ref: public_standrews_tin_50nm_reflectance_measurement
  auxiliary_measurement_refs:
    - public_standrews_tin_50nm_transmittance_measurement
  status_ceiling: weak_within_dataset_holdout
  wavelength_window:
    min: 400
    max: 1000
    unit: nm
  thresholds_ref: docs/phase3c3_standrews_threshold_policy.yaml
