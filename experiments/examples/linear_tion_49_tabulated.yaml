schema_version: "0.1"
experiment_id: linear_tion_49_tabulated_001
question: "Can Eternity run a deterministic linear TMM prediction from a registry-backed TiON_49 epsilon table?"
hypothesis: "A frozen tabulated TiON_49 epsilon table is sufficient for real-data grounding, but not for calibrated evidence without independent R/T holdout data."

sample:
  sample_id: tion_49_40nm_1p0pa
  material: TiON
  thickness:
    value: 40
    unit: nm
  material_model:
    type: tabulated_epsilon
    parameters_ref: tion_49_1p0pa_epsilon_model
    registry_path: lab_data/registry.yaml
    material_model_ref: tion_49_1p0pa_epsilon_model

input_pulse:
  kind: synthetic_gaussian
  center_wavelength:
    value: 650
    unit: nm
  bandwidth:
    value: 160
    unit: nm

geometry:
  incidence_angle:
    value: 0
    unit: deg
  polarization: TM
  incident_medium: air
  substrate: glass

simulator:
  name: linear_transfer_matrix
  version: "0.1"
  wavelength_range:
    min: 450
    max: 900
    points: 451
    unit: nm

observables:
  - transmission_spectrum
  - reflection_spectrum
  - absorption

acceptance_tests:
  - registry_artifact_hashes
  - tabulated_epsilon_interpolation
  - energy_accounting
  - deterministic_replay
  - no_calibrated_evidence_without_holdout

validity_envelope:
  wavelength:
    min: 450
    max: 900
    unit: nm
  fluence:
    min: 0
    max: 0.01
    unit: mJ/cm^2
  trusted_notes:
    - "Linear TMM grounding run using a frozen TiON_49 tabulated epsilon file."
    - "Only wavelengths inside the raw table are trusted."
  untrusted_notes:
    - "No raw TiON_49 R/T holdout has been registered."
    - "Substrate is approximated as lossless glass until sample stack provenance is confirmed."
    - "No nonlinear, pump-probe, FROG, roughness, backside reflection, or detector response is modeled."
