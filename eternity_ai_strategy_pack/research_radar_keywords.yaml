classification_labels:
  actionability:
    A: "immediately useful to Eternity"
    B: "conceptual architecture idea"
    C: "relevant but not actionable yet"
    D: "low priority / mostly noise"
    E: "read later"
  maturity:
    - paper
    - benchmark
    - code_repo
    - blog
    - review
    - product_doc
    - speculative_post
  transfer_type:
    - schema_design
    - memory_policy
    - context_routing
    - hypothesis_eval
    - experiment_selection
    - physics_tool
    - automation_workflow
    - codex_skill
    - literature_radar

required_digest_fields:
  - title
  - authors_or_org
  - date
  - url
  - theme_tags
  - one_sentence_summary
  - what_problem_it_solves
  - evaluator_or_feedback_signal
  - what_state_or_memory_improves
  - transfer_to_eternity
