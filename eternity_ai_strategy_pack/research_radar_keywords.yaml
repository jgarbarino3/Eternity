# Eternity AI Research Radar Config v0
# This is a starter config for a future paper/post scanner.
# The scanner should produce short Markdown digests and/or GitHub issues.

snapshot_date: "2026-05-08"
status: "draft_subject_to_change"

purpose: >
  Track AI/science-agent work that could help Eternity build a physics-grounded,
  provenance-aware hypothesis and failed-hypothesis learning harness for ultrafast ENZ optics.

