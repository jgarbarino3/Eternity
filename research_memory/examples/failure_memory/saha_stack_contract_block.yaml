title: Saha TiN/AZO source tables are exported but stack-contract blocked
summary: Saha Fig. 2b and Fig. 2c/d source tables are canonicalized, but no-fit TMM residual modeling is blocked by silicon/backside/coherence and leakage uncertainties.
body: The Windows Origin Viewer export cleared the OPJU table extraction blocker, and Phase 3E.3A produced canonical measured reflectance, source-simulated reflectance, TiN epsilon, and AZO epsilon tables. Phase 3E.3B blocked TMM because silicon optical constants, substrate backside/coherence handling, and interface or oxide assumptions are not source-backed tightly enough.
