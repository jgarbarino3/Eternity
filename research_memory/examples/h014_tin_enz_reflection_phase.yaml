claims:
  - TiN ENZ reflection may impose wavelength-dependent phase that reshapes broadband pulses.
limitations:
  - Current evidence does not isolate linear dispersion, nonlinear response, alignment, filtering, or retrieval artifact.
  - No holdout validation artifact supports this hypothesis.
next_actions:
  - Simulate broadband pulse reflection from TiN using measured or fit epsilon.
  - Run matched no-sample, TiN, and neutral-mirror FROG at multiple energies.
