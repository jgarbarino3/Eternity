[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eternity"
version = "0.1.0"
description = "Reproducible ENZ thin-film digital-twin experiments."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pint>=0.23",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "tmm>=0.2",
  "typer>=0.12",
]

[project.scripts]
eternity = "eternity.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
