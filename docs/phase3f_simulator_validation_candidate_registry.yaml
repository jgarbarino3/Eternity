  - candidate_id: filmoptics_inverse_solutions_2022
    title: Extracting Film Thickness and Optical Constants from Spectrophotometric Data
    material_family: ITO, NiO, MAPbI3
    source_type: zenodo_github_article_package
    source_refs:
      - DOI 10.1371/journal.pone.0276555
      - Zenodo DOI 10.5281/zenodo.7228228
      - GitHub Autonomous-Scientific-Discovery/FilmOptics-InverseSolutions
    source_urls:
      - https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0276555
      - https://zenodo.org/records/7228228
      - https://github.com/Autonomous-Scientific-Discovery/FilmOptics-InverseSolutions
    exact_files_or_records:
      - experimental ITO and MAPbI3 spectrophotometric examples
      - measured R/T spectra described over 350-1000 nm
    scouting_notes:
      - Article states experimental data include metal oxides and MAPbI3, with spectrophotometric R/T measurements.
      - Article states light falls normally on the films for the present spectrophotometry.
      - Optical constants are extracted from the same R/T spectra by optimization, so the material/holdout split is not leakage-safe for this phase.
    evidence:
      public_access: true
      machine_readable_material_constants: false
      machine_readable_measured_holdout: true
      geometry_specified: true
      stack_thickness_specified: true
      substrate_backside_coherence_specified: false
      leakage_safe_no_fit_split: false
      tmm_suitable: true
      source_hash_ready: false
    tie_breakers:
      stack_simplicity_rank: 2
      normal_incidence: true
      open_format_priority: 2
      non_enz_or_non_claim_context: true
      substrate_backside_clarity_rank: 4
    proposed_scout_label: promising_but_blocked
    decision: blocked_by_leakage_and_substrate_contract
    blockers:
      - Optical constants are extracted from the measured spectra rather than independent source inputs.
      - Substrate/backside/coherence treatment is not source-backed enough from landing-page inspection.
      - No source-file hashes were recorded in Phase 3F.1.
    exact_next_action: inspect Zenodo/GitHub file tree only if no cleaner candidate appears

